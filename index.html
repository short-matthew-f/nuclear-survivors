<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101810" />
    <meta
      name="description"
      content="A touch-first survival roguelite. Enter the exclusion zone. Adapt. Extract."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <title>Nuclear Survivors</title>
  </head>
  <body>
    <main id="app" aria-label="Nuclear Survivors">
      <canvas
        id="game"
        aria-label="Survival arena. Drag to move. Weapons fire automatically."
      ></canvas>
      <div id="hud" hidden>
        <div class="hud-top">
          <div
            class="vitals"
            role="progressbar"
            aria-label="Health"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="100"
          >
            <span class="health-symbol" aria-hidden="true">♡</span>
            <div class="health-track"><div id="health"></div></div>
            <span id="health-label" hidden>100 / 100</span
            ><span id="operator-label" hidden></span
            ><span id="level" hidden></span><span id="kills" hidden></span>
          </div>
          <div class="clock">
            <strong id="timer">Extract 8:00</strong
            ><span id="phase" hidden></span>
          </div>
          <button class="icon-button" id="pause" aria-label="Pause game">
            Ⅱ
          </button>
        </div>
        <div class="xp-track"><div id="xp"></div></div>
        <div id="boss-hud" hidden>
          <span id="boss-name"></span>
          <div><i id="boss-health"></i></div>
        </div>
        <div id="announcement" role="status" aria-live="polite"></div>
        <div id="loadout"></div>
        <div id="field-objective" hidden>
          <strong id="objective-name"></strong
          ><small id="objective-detail"></small
          ><small id="objective-instruction"></small>
          <div><i id="objective-progress"></i></div>
        </div>
        <div id="buff-status"></div>
        <div id="field-radar" role="img" aria-label="Field radar">
          <canvas id="radar" aria-hidden="true"></canvas>
        </div>
        <div id="combat-objective" hidden>
          <strong id="combat-objective-title"></strong
          ><span id="combat-objective-detail"></span>
          <div><i id="combat-objective-progress"></i></div>
        </div>
        <div id="hit-notice" hidden></div>
        <div id="mission-hud" hidden></div>
        <button id="overtime" hidden>
          OVERTIME ↗ <small>+4 MIN · +75% SALVAGE</small>
        </button>
        <div id="touch-hint"><strong id="move-hint">Drag to move</strong></div>
        <div class="abilities" aria-label="Combat controls">
          <div class="ability-control dash-control">
            <button id="dash" class="ability" aria-label="Dash">
              <svg class="cooldown-ring" viewBox="0 0 80 80" aria-hidden="true">
                <circle class="cooldown-track" cx="40" cy="40" r="36" />
                <circle
                  class="cooldown-progress"
                  cx="40"
                  cy="40"
                  r="36"
                  pathLength="100"
                /></svg
              ><span>⤳</span><b hidden></b>
            </button>
          </div>
          <div class="ability-control nova-control">
            <button id="nova" class="ability nova" aria-label="Shockwave">
              <svg class="cooldown-ring" viewBox="0 0 80 80" aria-hidden="true">
                <circle class="cooldown-track" cx="40" cy="40" r="36" />
                <circle
                  class="cooldown-progress"
                  cx="40"
                  cy="40"
                  r="36"
                  pathLength="100"
                /></svg
              ><span>✺</span><b hidden></b>
            </button>
          </div>
        </div>
        <div id="extract-hud" hidden>
          EXTRACTING <span id="extract-percent">0%</span>
          <div><i id="extract-fill"></i></div>
        </div>
      </div>
      <section id="overlay" class="overlay" aria-label="Game menu"></section>
      <div id="resume-cover" hidden role="region" aria-label="Resume countdown">
        <div class="resume-orientation">
          <p>Find your survivor. The field is paused.</p>
          <strong id="resume-count" aria-live="polite">3</strong
          ><button id="resume-now">Resume now</button
          ><button id="resume-cancel">Stay paused</button>
        </div>
      </div>
      <input
        id="import-save"
        type="file"
        accept="application/json,.json"
        hidden
      />
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="update-banner" hidden>
        New field build ready.<button id="apply-update">UPDATE</button>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
