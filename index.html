<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101810" />
    <meta
      name="description"
      content="A touch-first survival roguelite. Enter the exclusion zone. Adapt. Extract."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <title>Nuclear Survivors</title>
  </head>
  <body>
    <main id="app" aria-label="Nuclear Survivors">
      <canvas
        id="game"
        aria-label="Survival arena. Drag to move. Weapons fire automatically."
      ></canvas>
      <div id="hud" hidden>
        <div class="hud-top">
          <div class="vitals">
            <div class="vitals-label">
              <span id="operator-label">NOMAD</span
              ><span id="health-label">100 / 100</span>
            </div>
            <div class="health-track"><div id="health"></div></div>
            <div class="hud-meta">
              <span id="level">LV 1</span><span id="kills">0 KILLS</span>
            </div>
          </div>
          <div class="clock">
            <strong id="timer">00:00</strong
            ><span id="phase">EXTRACTION IN 08:00</span>
          </div>
          <button class="icon-button" id="pause" aria-label="Pause game">
            Ⅱ
          </button>
        </div>
        <div class="xp-track"><div id="xp"></div></div>
        <div id="boss-hud" hidden>
          <span id="boss-name"></span>
          <div><i id="boss-health"></i></div>
        </div>
        <div id="announcement" role="status" aria-live="polite"></div>
        <div id="loadout"></div>
        <div id="field-objective" hidden>
          <strong id="objective-name"></strong
          ><small id="objective-detail"></small
          ><small id="objective-instruction"></small>
          <div><i id="objective-progress"></i></div>
        </div>
        <div id="buff-status"></div>
        <div id="mission-hud" hidden></div>
        <button id="overtime" hidden>
          OVERTIME ↗ <small>+4 MIN · +75% SALVAGE</small>
        </button>
        <div id="touch-hint">
          DRAG ANYWHERE TO MOVE <span>WEAPONS FIRE AUTOMATICALLY</span>
        </div>
        <div class="abilities">
          <button id="dash" class="ability" aria-label="Dash">
            <span>⤳</span><small>DASH</small><b></b></button
          ><button id="nova" class="ability nova" aria-label="Shockwave">
            <span>✺</span><small>SHOCKWAVE</small><b></b>
          </button>
        </div>
        <div id="extract-hud" hidden>
          EXTRACTING <span id="extract-percent">0%</span>
          <div><i id="extract-fill"></i></div>
        </div>
      </div>
      <section id="overlay" class="overlay" aria-label="Game menu"></section>
      <input
        id="import-save"
        type="file"
        accept="application/json,.json"
        hidden
      />
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="update-banner" hidden>
        New field build ready.<button id="apply-update">UPDATE</button>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
